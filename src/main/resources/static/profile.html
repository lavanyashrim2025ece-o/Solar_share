<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolarShare | Profile</title><link rel="icon" href="img/logo.svg"><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar" id="topbar"></header>
<main><div class="pf">
    <aside class="side">
        <button class="on" data-p="pInfo" type="button">👤 Profile</button>
        <button data-p="pPass" type="button">🔒 Change password</button>
    </aside>
    <div>
        <div id="pInfo" class="pane on card">
            <h2 style="margin:0">Profile</h2><p class="hint">Manage your household and account information</p>
            <div class="ph"><div class="av" id="av"></div><div><b id="pName"></b><div class="hint" id="pMeta"></div></div></div>
            <form id="formProfile" novalidate>
                <div class="row2">
                    <div><label for="fName">Full name</label><input id="fName"></div>
                    <div><label for="fEmail">Email address</label><input id="fEmail" readonly></div>
                    <div><label for="fHid">Household ID</label><input id="fHid" inputmode="numeric"></div>
                    <div><label for="fRatio">Allocation ratio</label><input id="fRatio" type="number" step="0.01"></div>
                </div>
                <label for="fAddr">Household address</label><textarea id="fAddr" placeholder="Block 12, Green Valley Apartments"></textarea>
                <div class="err" id="errP" role="alert"></div>
                <button class="btn" type="submit">Save Changes</button>
            </form>
            <div class="band"><span style="font-size:1.8rem">🏠</span><div><b>Your household is part of the SolarShare community.</b><div class="hint" style="margin:0">Together we generate clean energy and build a sustainable future.</div></div></div>
        </div>
        <div id="pPass" class="pane card">
            <h2 style="margin:0">Change password</h2><p class="hint">Use 8+ characters with letters and a number.</p>
            <form id="formPass" novalidate style="max-width:420px">
                <label for="pOld">Current password</label><input id="pOld" type="password" autocomplete="current-password">
                <label for="pNew">New password</label><input id="pNew" type="password" autocomplete="new-password">
                <label for="pNew2">Confirm new password</label><input id="pNew2" type="password" autocomplete="new-password">
                <div class="err" id="errW" role="alert"></div>
                <button class="btn" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div></main>
<div id="toast" role="status"></div>
<script src="js/app.js"></script><script src="js/profile.js"></script>
</body></html>
